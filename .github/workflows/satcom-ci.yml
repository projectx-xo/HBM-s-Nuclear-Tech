name: tjHBM-NTM PROD

on:
  workflow_dispatch:
  push:
    branches:
      - feature/oc-satcom-relay
    paths:
      - .github/PROD_VERSION

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read PROD version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < .github/PROD_VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=tjHBM-NTM-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build

      - name: Rename PROD JAR
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" "build/libs/${{ steps.version.outputs.release }}.jar"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.release }}
          path: build/libs/${{ steps.version.outputs.release }}.jar
          if-no-files-found: error

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release }}
          name: ${{ steps.version.outputs.release }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: build/libs/${{ steps.version.outputs.release }}.jar
